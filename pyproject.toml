[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softmax-fix"
version = "0.1.0"
description = "Cross-entropy and distillation losses that keep the target logit's gradient"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "tatra-labs"}]
keywords = ["pytorch", "softmax", "cross-entropy", "numerical-stability", "distillation", "grokking"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
experiments = ["matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/tatra-labs/softmax-fix"

[tool.setuptools]
packages = ["softmax_fix"]
